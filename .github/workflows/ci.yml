name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to Node 20 (Next.js 16's minimum) rather than 22/24: the
          # latter trip npm/cli's known "Exit handler never called!" bug on
          # GitHub-hosted runners during `npm ci` for packages with install
          # scripts (e.g. esbuild) — see npm/cli#8974.
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Generate search index
        run: npm run generate
        working-directory: web
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: web
      - name: Build (static export)
        run: npm run build
        working-directory: web
