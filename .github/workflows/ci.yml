name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Update npm
        # The npm version bundled with setup-node's Node 20/22/24 images has a
        # recurring "Exit handler never called!" bug (npm/cli#8974) that
        # deterministically kills `npm ci` here; a current npm release fixes it.
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Generate search index
        run: npm run generate
        working-directory: web
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: web
      - name: Build (static export)
        run: npm run build
        working-directory: web
