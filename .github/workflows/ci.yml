name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Caching disabled while diagnosing a reproducible npm ci hang —
          # ruling out a corrupted/stale actions/cache entry as the cause.
      - name: Update npm
        # The npm 10.8.2 bundled with setup-node's Node 20 image has a
        # recurring "Exit handler never called!" bug (npm/cli#8974) that
        # deterministically kills `npm ci` here. npm 12 requires Node
        # >=22.22.2 so isn't installable under Node 20; npm 11 supports
        # Node 20.17+ and doesn't carry the bug.
        run: npm install -g npm@11
      - name: Install dependencies
        # `npm ci` has been reproducibly hanging on this runner pool through
        # every attempt (each force-killed at its 180s timeout). Verbose
        # logging surfaces exactly which package/request it's stuck on.
        run: timeout -k 10 180 npm ci --loglevel verbose
        working-directory: web
      - name: Generate search index
        run: npm run generate
        working-directory: web
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: web
      - name: Build (static export)
        run: npm run build
        working-directory: web
