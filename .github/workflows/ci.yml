name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Update npm
        # The npm 10.8.2 bundled with setup-node's Node 20 image has a
        # recurring "Exit handler never called!" bug (npm/cli#8974) that
        # deterministically kills `npm ci` here. npm 12 requires Node
        # >=22.22.2 so isn't installable under Node 20; npm 11 supports
        # Node 20.17+ and doesn't carry the bug.
        run: npm install -g npm@11
      - name: Install dependencies
        # A bare `npm ci` has been observed to hang indefinitely on this
        # runner pool (no error, no progress) rather than failing fast; cap
        # each attempt at 3 minutes and retry up to 3 times.
        run: timeout 180 npm ci || timeout 180 npm ci || npm ci
        working-directory: web
      - name: Generate search index
        run: npm run generate
        working-directory: web
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: web
      - name: Build (static export)
        run: npm run build
        working-directory: web
