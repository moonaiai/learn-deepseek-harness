name: deploy-pages

# Builds the Next.js course site (web/) as a static export and publishes it to
# GitHub Pages at https://<owner>.github.io/learn-deepseek-harness/.
# Triggers on every push to main — no path filter — so any content or code
# change (content/**, web/**) redeploys automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Update npm
        # See ci.yml for why this step exists (npm/cli#8974) and why npm 11
        # rather than latest (npm 12 requires Node >=22.22.2).
        run: npm install -g npm@11
      - name: Install dependencies
        # See ci.yml for why this retries with a per-attempt timeout, and why
        # `-k 10` (force-kill) rather than a bare `timeout`.
        run: timeout -k 10 180 npm ci || timeout -k 10 180 npm ci || npm ci
        working-directory: web
      - name: Build static site (basePath=/learn-deepseek-harness)
        working-directory: web
        run: npm run build
        env:
          NEXT_BASE_PATH: /learn-deepseek-harness
      - name: Add a root redirect to ./zh/
        # The exported out/index.html redirects to /zh/ (host root), which is
        # wrong under a project-site base path; overwrite it with a relative
        # redirect so it works at /learn-deepseek-harness/ too.
        run: |
          printf '%s' '<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./zh/"><title>learn-deepseek-harness</title></head><body><p>Redirecting to the <a href="./zh/">learn-deepseek-harness</a> course&hellip;</p></body></html>' > web/out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
